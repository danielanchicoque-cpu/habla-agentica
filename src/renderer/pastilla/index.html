<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <link rel="stylesheet" href="pastilla.css">
</head>
<body>
  <div id="pastilla" class="reposo">
    <svg id="logo" viewBox="0 0 20 12" aria-hidden="true">
      <rect x="1" y="4.5" width="2" height="3" rx="1"/><rect x="5" y="2.5" width="2" height="7" rx="1"/>
      <rect x="9" y="0.5" width="2" height="11" rx="1"/><rect x="13" y="2.5" width="2" height="7" rx="1"/>
      <rect x="17" y="4.5" width="2" height="3" rx="1"/>
    </svg>
    <button id="btn-cancelar" class="boton" title="Cancelar (Esc)" aria-label="Cancelar">
      <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6"/></svg>
    </button>
    <canvas id="ondas"></canvas>
    <button id="btn-terminar" class="boton terminar" title="Terminar y pegar" aria-label="Terminar">
      <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3l2.4 2.4 4.6-5"/></svg>
    </button>
    <span id="punto"></span>
    <span id="mensaje"></span>
    <button id="btn-deshacer" class="deshacer">Deshacer</button>
    <span id="progreso"></span>
  </div>
  <script src="wav.js"></script>
  <script src="pastilla.js"></script>
</body>
</html>
